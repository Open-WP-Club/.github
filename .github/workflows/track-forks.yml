name: Track Weekly Repository Growth & Traffic

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-data-writers
  cancel-in-progress: false

jobs:
  track-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Track repository traffic
        id: track
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN || github.token }}
        run: node scripts/track-repository-traffic.mjs

      - name: Commit and push changes
        run: |
          if git diff --quiet -- downloads.csv stats.csv traffic-state.json; then
            echo "No tracking changes to commit"
            exit 0
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add downloads.csv stats.csv traffic-state.json
          git commit -m "📊 Weekly repo tracking: ${{ steps.track.outputs.week_id }} - ${{ steps.track.outputs.total_repos }} repos, ${{ steps.track.outputs.total_stars }} stars, ${{ steps.track.outputs.total_forks }} forks, ${{ steps.track.outputs.total_clones }} clones, ${{ steps.track.outputs.total_views }} views"
          git pull --rebase
          git push

      - name: Upload tracking files
        uses: actions/upload-artifact@v7
        with:
          name: weekly-repo-tracking-csvs
          path: |
            downloads.csv
            stats.csv
            traffic-state.json
          retention-days: 90
          if-no-files-found: error
