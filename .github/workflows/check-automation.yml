name: Check repository automation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: check-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check scripts and run tests
        run: npm run check
