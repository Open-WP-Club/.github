name: Check repository automation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'actions/**'
      - 'test/**'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'actions/**'
      - 'test/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: check-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check scripts and run tests
        run: npm run check
