name: Update plugins.csv

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-data-writers
  cancel-in-progress: false

jobs:
  update-plugins-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Update plugins.csv
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORGANIZATION: Open-WP-Club
        run: node scripts/update-plugins-csv.mjs

      - name: Commit and push changes
        run: |
          if git diff --quiet -- plugins.csv; then
            echo "plugins.csv is already current"
            exit 0
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add plugins.csv
          git commit -m "Update plugins.csv"
          git pull --rebase
          git push
