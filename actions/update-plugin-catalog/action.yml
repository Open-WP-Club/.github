name: Update Open WP Club product catalog
description: Update one product release in catalog.json and the legacy CSV feed

inputs:
  token:
    description: Token with Contents write access to Open-WP-Club/.github
    required: true
  repo-name:
    description: Product repository name
    required: true
  version:
    description: Published release tag
    required: true
  release-url:
    description: Published release URL
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout the plugin catalog
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: Open-WP-Club/.github
        token: ${{ inputs.token }}
        path: .open-wp-plugin-catalog
        fetch-depth: 1
        sparse-checkout: |
          catalog.json
          plugins.csv
        sparse-checkout-cone-mode: false

    - name: Update the released plugin row
      shell: bash
      env:
        CATALOG_PATH: ${{ github.workspace }}/.open-wp-plugin-catalog/plugins.csv
        PRODUCT_CATALOG_PATH: ${{ github.workspace }}/.open-wp-plugin-catalog/catalog.json
        PRODUCT_REPO_NAME: ${{ inputs.repo-name }}
        PRODUCT_VERSION: ${{ inputs.version }}
        PRODUCT_RELEASE_URL: ${{ inputs.release-url }}
      run: node "$GITHUB_ACTION_PATH/update.mjs"

    - name: Commit and push the catalog update
      shell: bash
      working-directory: .open-wp-plugin-catalog
      env:
        PRODUCT_REPO_NAME: ${{ inputs.repo-name }}
      run: |
        if git diff --quiet -- catalog.json plugins.csv; then
          echo "The product catalog is already current for $PRODUCT_REPO_NAME"
          exit 0
        fi

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add catalog.json plugins.csv
        git commit -m "Update $PRODUCT_REPO_NAME in product catalog"

        for attempt in 1 2 3; do
          if git push; then
            exit 0
          fi
          echo "Push attempt $attempt failed; rebasing on the latest catalog"
          git pull --rebase
        done

        echo "Unable to push the product catalog after three attempts" >&2
        exit 1
